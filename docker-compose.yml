services:
  source:
    build: .
    command: uvicorn app.source:app --host 0.0.0.0 --port 8081
    environment:
      DATA_DIR: /data
      SOURCE_DB: /data/source.db
    ports:
      - "8081:8081"
    volumes:
      - collector-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8080
    environment:
      DATA_DIR: /data
      COLLECTOR_DB: /data/collector.db
      # 演示/回归时序钩子开关：默认关闭（生产零影响）。
      # 需要演示“提交中途取消/等锁取消”时改为 1，配合 scripts/cancel_demo.py。
      COLLECTOR_TEST_HOOKS: "0"
    ports:
      - "8080:8080"
    volumes:
      - collector-data:/data
    depends_on:
      source:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10

  worker1:
    build: .
    command: python -m app.worker
    environment:
      DATA_DIR: /data
      COLLECTOR_DB: /data/collector.db
      LEASE_SECONDS: "15"
    volumes:
      - collector-data:/data
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker_healthcheck.sh"]
      interval: 5s
      timeout: 4s
      retries: 10

  worker2:
    build: .
    command: python -m app.worker
    environment:
      DATA_DIR: /data
      COLLECTOR_DB: /data/collector.db
      LEASE_SECONDS: "15"
    volumes:
      - collector-data:/data
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker_healthcheck.sh"]
      interval: 5s
      timeout: 4s
      retries: 10

  # 一次性回归测试：独立临时库，不挂载共享卷，跑完即退出。
  # 用法: docker compose run --rm tests
  tests:
    build: .
    command: python -m pytest -q
    environment:
      COLLECTOR_TEST_HOOKS: "1"
      TMPDIR: /tmp
    # 不挂载 collector-data：conftest 强制使用 /tmp 下的独立库，与其他服务完全隔离

volumes:
  collector-data:
